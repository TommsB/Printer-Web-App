services:
  printers:
    build: .
    container_name: printer-manager
    restart: unless-stopped
    ports:
      # Host port: 8000 unless APP_PORT is set in a .env file next to this one (not in git),
      # e.g. APP_PORT=8010 on a server where 8000 is already taken.
      - "${APP_PORT:-8000}:8000"
    environment:
      SNMP_COMMUNITY: public
      POLL_INTERVAL_MINUTES: "15"
    volumes:
      # Named volume, not a bind mount: SQLite WAL fails on Windows-host bind mounts
      # ("disk I/O error"). On Linux either works; backup: see README.
      - printer-data:/app/data
      - ./auth_users.json:/app/auth_users.json:ro  # logins (scripts/hash_password.py)
    # SNMP needs to reach the printer subnets. If the Linux VM can route to them,
    # the default bridge network is enough (outbound traffic is NATed).

volumes:
  printer-data:
